services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: parkflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-parkflow}
      POSTGRES_DB: parkflow
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parkflow -d parkflow"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15

  minio:
    platform: linux/amd64
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-parkflow-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-parkflow-local-storage}
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
    volumes:
      - objects:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  backend:
    platform: linux/amd64
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://parkflow:${POSTGRES_PASSWORD:-local-parkflow}@postgres:5432/parkflow
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:4000:4000"
    command: sh -c "npx prisma migrate deploy && node dist/src/server.js"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  worker:
    platform: linux/amd64
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://parkflow:${POSTGRES_PASSWORD:-local-parkflow}@postgres:5432/parkflow
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    command: node dist/src/jobs/worker.js
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  objects:
